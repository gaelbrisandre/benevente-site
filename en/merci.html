<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Message sent — BénéVente</title>
<link href="../style.css" rel="stylesheet"/>
<style>
    .success-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: #f8fafc;
    }

    .success-card {
      width: 100%;
      max-width: 620px;
      padding: 55px 45px;
      background: #ffffff;
      border: 1px solid #e1e7ee;
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(11, 48, 78, 0.08);
    }

    .success-icon {
      width: 68px;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 25px;
      border-radius: 50%;
      background: #fff1f0;
      color: #f5564d;
      font-size: 32px;
      font-weight: 800;
    }

    .success-card h1 {
      margin-bottom: 16px;
      color: #0b304e;
      font-size: 38px;
      line-height: 1.2;
    }

    .success-card p {
      max-width: 480px;
      margin: 0 auto 30px;
      color: #64748b;
      font-size: 16px;
      line-height: 1.7;
    }

    .success-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 24px;
      background: #f5564d;
      color: #ffffff;
      border-radius: 11px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(245, 86, 77, 0.20);
      transition: 0.2s ease;
    }

    .success-button:hover {
      background: #df403f;
      transform: translateY(-2px);
    }

    @media (max-width: 550px) {
      .success-card {
        padding: 40px 22px;
      }

      .success-card h1 {
        font-size: 30px;
      }
    }
  </style>
</head>
<body>
<main class="success-page">
<div class="success-card">
<div class="success-icon">✓</div>
<h1>Message sent!</h1>
<p>
        Thank you for your message.<br/>
        We'll reply as soon as possible.
      </p>
<a class="success-button" href="index.html">
        Back to home
      </a>
</div>
</main>
<a class="language-switch" href="../merci.html">🇫🇷 FR</a></body>
</html>
